<svg xmlns="http://www.w3.org/2000/svg" width="840" height="322" viewBox="0 0 840 322" role="img" aria-label="How Reconcile works: exports, prepare, investigate, report"><title>How Reconcile works: exports, prepare, investigate, report</title><rect width="840" height="322" rx="10" fill="#1a1a19"/><text x="24" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f0efec" text-anchor="start">How Reconcile investigates an exception</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker></defs><rect x="24.0" y="58" width="174.0" height="150" rx="8" fill="#232322" stroke="#3a3a37" stroke-width="1"/><text x="38.0" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#f0efec" text-anchor="start">Your exports</text><text x="38.0" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Accounting CSV</text><text x="38.0" y="123" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">or Xero JSON</text><text x="38.0" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Bank CSV</text><text x="38.0" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">or CAMT.053 XML</text><line x1="202.0" y1="133.0" x2="225.0" y2="133.0" stroke="#3987e5" stroke-width="2" marker-end="url(#ah)"/><rect x="230.0" y="58" width="174.0" height="150" rx="8" fill="#232322" stroke="#3987e5" stroke-width="1.5"/><text x="244.0" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#f0efec" text-anchor="start">1  Prepare</text><text x="244.0" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3987e5" text-anchor="start">reconcile data prepare</text><text x="244.0" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Maps columns and dates</text><text x="244.0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Logs what you declare</text><text x="244.0" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Refuses to guess</text><line x1="408.0" y1="133.0" x2="431.0" y2="133.0" stroke="#3987e5" stroke-width="2" marker-end="url(#ah)"/><rect x="436.0" y="58" width="174.0" height="150" rx="8" fill="#232322" stroke="#3987e5" stroke-width="1.5"/><text x="450.0" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#f0efec" text-anchor="start">2  Investigate</text><text x="450.0" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3987e5" text-anchor="start">reconcile investigate</text><text x="450.0" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Deterministic rules</text><text x="450.0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Exact decimal money</text><text x="450.0" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Read-only and offline</text><line x1="614.0" y1="133.0" x2="637.0" y2="133.0" stroke="#3987e5" stroke-width="2" marker-end="url(#ah)"/><rect x="642.0" y="58" width="174.0" height="150" rx="8" fill="#232322" stroke="#3987e5" stroke-width="1.5"/><text x="656.0" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#f0efec" text-anchor="start">3  Report</text><text x="656.0" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#3987e5" text-anchor="start">HTML and JSON</text><text x="656.0" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Conclusion, next steps</text><text x="656.0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Cited source rows</text><text x="656.0" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Exact calculations</text><text x="24" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f0efec" text-anchor="start">Every case ends in exactly one outcome. Missing evidence never becomes “nothing wrong”.</text><rect x="24.0" y="256" width="189.0" height="48" rx="6" fill="#1a1a19" stroke="#3a3a37"/><text x="36.0" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#f0efec" text-anchor="start">Answered</text><text x="36.0" y="293" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">a supported conclusion</text><rect x="225.0" y="256" width="189.0" height="48" rx="6" fill="#1a1a19" stroke="#3a3a37"/><text x="237.0" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#f0efec" text-anchor="start">Abstained</text><text x="237.0" y="293" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">not enough evidence</text><rect x="426.0" y="256" width="189.0" height="48" rx="6" fill="#1a1a19" stroke="#3a3a37"/><text x="438.0" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#f0efec" text-anchor="start">Out of scope</text><text x="438.0" y="293" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">not a supported case</text><rect x="627.0" y="256" width="189.0" height="48" rx="6" fill="#1a1a19" stroke="#3a3a37"/><text x="639.0" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#f0efec" text-anchor="start">Failed</text><text x="639.0" y="293" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">an error, reported</text></svg>