" font-weight="400" fill="#9a988f" text-anchor="middle">50%</text><line x1="626.5" y1="112" x2="626.5" y2="214" stroke="#2c2c2a" stroke-width="1"/><text x="626.5" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a988f" text-anchor="middle">75%</text><line x1="744.0" y1="112" x2="744.0" y2="214" stroke="#2c2c2a" stroke-width="1"/><text x="744.0" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a988f" text-anchor="middle">100%</text><text x="24" y="133.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#f0efec" text-anchor="start">Reconcile</text><path d="M274,119.0 H724.7154471544716 Q728.7154471544716,119.0 728.7154471544716,123.0 V135.0 Q728.7154471544716,139.0 724.7154471544716,139.0 H274 Z" fill="#3987e5"/><text x="736.7154471544716" y="133.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#f0efec" text-anchor="start">96.7%  (119/123)</text><text x="24" y="167.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">ML baseline (answers every case)</text><path d="M274,153.0 H686.5040650406504 Q690.5040650406504,153.0 690.5040650406504,157.0 V169.0 Q690.5040650406504,173.0 686.5040650406504,173.0 H274 Z" fill="#75746e"/><text x="698.5040650406504" y="167.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#f0efec" text-anchor="start">88.6%  (109/123)</text><text x="24" y="201.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">ML baseline (confident cases only)</text><path d="M274,187.0 H629.1869918699